<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>illume — Automated Social Media for Academic Journals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <button class="hamburger" id="hamburger" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" id="navClose" aria-label="Close menu">✕</button>
        <ul class="nav-overlay-menu">
            <li><a href="#home" class="nav-overlay-link">Home</a></li>
            <li><a href="reach.html" class="nav-overlay-link">Reach</a></li>
            <li><a href="nexus.html" class="nav-overlay-link">Nexus</a></li>
            <li><a href="research.html" class="nav-overlay-link">Research</a></li>
            <li><a href="mailto:contact@illume.com" class="nav-overlay-link">Contact</a></li>
        </ul>
    </div>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <video class="hero-video" id="heroV1" autoplay muted playsinline>
            <source src="video/hero.mp4" type="video/mp4">
            <source src="video/hero.webm" type="video/webm">
        </video>
        <video class="hero-video hero-video-standby" id="heroV2" muted playsinline>
            <source src="video/hero.mp4" type="video/mp4">
            <source src="video/hero.webm" type="video/webm">
        </video>
        <div class="hero-video-overlay"></div>
        <div class="hero-center">
            <img src="logo-transparent.png" alt="illume" class="hero-logo">
            <div class="hero-links">
                <a href="reach.html" class="hero-link">reach</a>
                <a href="nexus.html" class="hero-link">nexus</a>
                <a href="research.html" class="hero-link">research</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <img src="logo-transparent.png" alt="illume" class="footer-logo-img">
            <div class="footer-right">
                <p class="footer-copy">&copy; 2025 illume. All rights reserved.</p>
                <a href="mailto:contact@illume.com" class="footer-contact">contact@illume.com</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
